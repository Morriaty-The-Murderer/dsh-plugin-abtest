schema_version: 1

experiment:
  id: memory-plugin-v2
  name: Memory Plugin V1 versus V2
  hypothesis: Candidate improves factual recall without unacceptable efficiency regressions.

target:
  plugin: dsh-memory-plugin

variants:
  control:
    source: npm:dsh-memory-plugin@1.3.2
    config: variants/control.yml
  candidate:
    source: github:owner/dsh-memory-plugin#0123456789abcdef0123456789abcdef01234567
    config: variants/candidate.yml

runtime:
  dsh_version: 0.1.0-rc.7
  profile: headless
  model:
    provider: mock
    name: scripted-model
    parameters:
      temperature: 0
  workspace_fixture: fixtures/workspace
  sandbox: isolated-workspace

suite:
  cases: evals/cases.yml
  repetitions: 3

execution:
  order: counterbalanced
  concurrency: 2
  timeout_ms: 600000
  require_exposure: true

decision:
  minimum_valid_pairs: 6
  minimum_unique_cases: 2
  hard_gates:
    boot_success: true
    activation_success: true
    critical_security_violations: 0
    critical_case_regressions: 0
  primary:
    metric: task_success_rate
    policy: superiority
    minimum_absolute_lift: 0.03
  guardrails:
    median_token_increase_pct: 15
    p95_latency_increase_pct: 20
    tool_error_rate_increase_pp: 1
